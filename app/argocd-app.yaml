apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arvindgupta-cloud/deploy-portfolio-using-argocd.git    # Replace it with your forked repo
    targetRevision: main
    path: k8s
  destination:
    server: https://34.57.50.62   # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
