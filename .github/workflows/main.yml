name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }} -f app/Dockerfile ./app

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }}

      - name: Update Kubernetes Deployment File Tag
        run: |
          sed -i 's|image: ag126667/portfolio:.*|image: ag126667/portfolio:${{ github.sha }}|g' k8s/deployment.yaml

