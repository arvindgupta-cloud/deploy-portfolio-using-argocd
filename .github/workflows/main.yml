name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }} -f app/Dockerfile ./app

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }}

      - name: Update Kubernetes Deployment File Tag
        run: |
          sed -i 's|image: ${{ secrets.DOCKER_USERNAME }}/portfolio:.*|image: ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }}|g' k8s/deployment.yaml

      # ADD THIS NEW STEP BELOW
      - name: Commit and Push Updated YAML to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push origin main
